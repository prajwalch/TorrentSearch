name: Build release APK

on: workflow_dispatch

permissions:
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    environment: release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
    
    - name: Set up JDK 17
      uses: actions/setup-java@v6.0.1
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create keystore file
      uses: timheuer/base64-to-file@v2
      with:
        fileName: "release-keystore.jks"
        fileDir: "${{ github.workspace }}/"
        encodedString: ${{ secrets.KEYSTORE_FILE_BASE64 }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Assemble release APK with gradlew
      env:
        SIGNING_STORE_FILE: ${{ github.workspace }}/release-keystore.jks
        SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew app:assembleRelease

    - name: Generate SHA-256 checksum
      run: |
        cd app/build/outputs/apk/release
        sha256sum app-release.apk > SHA256_CHECKSUM.txt

    - name: Echo SHA-256 checksum
      run: cat app/build/outputs/apk/release/SHA256_CHECKSUM.txt

    - name: Generate artifact attestation
      id: attest
      uses: actions/attest@v4.2.2
      with:
        subject-path: 'app/build/outputs/apk/release/app-release.apk'

    - name: Upload APK, R8 mapping, checksum & attestation
      uses: actions/upload-artifact@v7.0.1
      with:
        name: torrentsearch-release-aritifacts
        path: |
          app/build/outputs/apk/release/app-release.apk
          app/build/outputs/mapping/release/mapping.txt
          app/build/outputs/apk/release/SHA256_CHECKSUM.txt
          ${{ steps.attest.outputs.bundle-path }}

    - name: Post-cleanup
      if: always()
      run: rm -rf release-keystore.jks