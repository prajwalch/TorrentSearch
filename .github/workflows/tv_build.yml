name: Build TV APK

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'fastlane/*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Set up JDK 17
      uses: actions/setup-java@v6.0.1
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Assemble TV debug APK
      run: ./gradlew app:assembleTvDebug

    - name: Assemble TV release APK
      run: ./gradlew app:assembleTvRelease

    - name: Locate build-tools
      run: echo "BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)" >> "$GITHUB_ENV"

    # --- Google TV quality criteria, enforced as build gates -------------------
    # Reference: https://developer.android.com/develop/adaptive-apps/quality-guidelines/tv-app-quality

    - name: TV-ML - manifest declares a LEANBACK_LAUNCHER activity
      run: |
        $BUILD_TOOLS/aapt2 dump xmltree --file AndroidManifest.xml \
          app/build/outputs/apk/tv/release/app-tv-release-unsigned.apk \
          | grep -q "android.intent.category.LEANBACK_LAUNCHER"

    - name: TV-MT - touchscreen, faketouch and leanback are all not required
      run: |
        badging=$($BUILD_TOOLS/aapt2 dump badging \
          app/build/outputs/apk/tv/release/app-tv-release-unsigned.apk)
        for feature in android.hardware.touchscreen android.hardware.faketouch android.software.leanback; do
          echo "$badging" | grep -q "uses-feature-not-required: name='$feature'" \
            || { echo "::error::$feature must be declared not-required"; exit 1; }
        done

    - name: TV-LB - 320x180 xhdpi banner is packaged and referenced
      run: |
        # Resource paths are obfuscated in release builds, so this resolves the
        # resource table rather than grepping zip entry names.
        $BUILD_TOOLS/aapt2 dump resources \
          app/build/outputs/apk/tv/release/app-tv-release-unsigned.apk \
          | grep -A2 "drawable/app_banner" \
          | tee /dev/stderr | grep -q "(xhdpi)"

    - name: TV-G6 - native libraries are 16 KB page aligned
      run: |
        $BUILD_TOOLS/zipalign -c -P 16 -v 4 \
          app/build/outputs/apk/tv/release/app-tv-release-unsigned.apk > /dev/null

    - name: TV-G6 - both 32-bit and 64-bit ABIs are shipped
      run: |
        abis=$(unzip -Z1 app/build/outputs/apk/tv/release/app-tv-release-unsigned.apk \
          | grep -oE '^lib/[^/]+' | sort -u)
        echo "$abis"
        echo "$abis" | grep -q 'lib/arm64-v8a'   # 64-bit
        echo "$abis" | grep -q 'lib/armeabi-v7a' # 32-bit

    - name: Rename TV debug APK
      run: |
        cd app/build/outputs/apk/tv/debug
        mv app-tv-debug.apk torrentsearch-tv-debug.apk

    - name: Rename TV release APK
      run: |
        cd app/build/outputs/apk/tv/release
        mv app-tv-release-unsigned.apk torrentsearch-tv-release-unsigned.apk

    - name: Generate SHA-256 checksums
      run: |
        cd app/build/outputs/apk/tv
        sha256sum debug/torrentsearch-tv-debug.apk release/torrentsearch-tv-release-unsigned.apk \
          > SHA256_CHECKSUM.txt
        cat SHA256_CHECKSUM.txt

    - name: Upload TV APKs
      uses: actions/upload-artifact@v7.0.1
      with:
        path: |
          app/build/outputs/apk/tv/debug/torrentsearch-tv-debug.apk
          app/build/outputs/apk/tv/release/torrentsearch-tv-release-unsigned.apk
          app/build/outputs/apk/tv/SHA256_CHECKSUM.txt
        archive: false

  nightly:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v7.0.1

    - uses: actions/setup-java@v6.0.1
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - run: chmod +x gradlew

    - name: Assemble TV staging APK
      run: ./gradlew app:assembleTvStaging

    - name: Rename
      run: |
        cd app/build/outputs/apk/tv/staging
        mv app-tv-staging.apk torrentsearch-tv-staging.apk

    - uses: actions/upload-artifact@v7.0.1
      with:
        path: app/build/outputs/apk/tv/staging/torrentsearch-tv-staging.apk
        archive: false